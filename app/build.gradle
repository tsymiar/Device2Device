apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"
    defaultConfig {
        applicationId "com.tsymiar.device2device"
        // SSH 服务端用的是 Apache MINA SSHD（纯 Java），它内部依赖 java.nio.file.Path，
        // Android 到 8.0(API 26) 才提供该包；引入后方法数也会超单 dex 上限，故开 multidex
        minSdkVersion 26 // 21 // Cannot fit requested classes in a single dex file
        multiDexEnabled true
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE"
                cppFlags "-std=c++11"
                arguments "-DBUILD_SCADUP_LIB=1" // "0" to compile with libscadup.so file
            }
        }
        splits {
            abi {
                reset()
                enable true
                universalApk false  // If true, also generate a universal APK
                include "x86_64", "arm64-v8a", "armeabi-v7a"
                // 'arm64-v8a', 64 bit ARM architecture,it can use v7 version
                //              unless you are too much concerned about performance
                // mips,mips64, There are no devices with MIPS
                //  x86_64, No android devices and anyway it can use X86 version
                //  armeabi, very old architecture. Unsupported after Android 4.4
                // 'x86', Intel based devices
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    packagingOptions {
        pickFirst 'lib/arm64-v8a/*.so'
        pickFirst 'lib/armeabi-v7a/*.so'
        pickFirst 'lib/x86_64/*.so'
        exclude 'META-INF/DEPENDENCIES'
    }
    compileOptions {
        sourceCompatibility = "1.8"
        targetCompatibility = "1.8"
    }
    ndkVersion '23.0.7599858'
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.aar').each { File file ->
        def name = file.name.lastIndexOf('.').with { it != -1 ? file.name[0..<it] : file.name }
        compile(name: name, ext: 'aar')
        dependencies.add("compile", [name: name, ext: 'aar'])
        compile 'com.android.support:appcompat-v7:23.4.0'
    }
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar', '*.so'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.activity:activity:1.4.0'
    implementation 'androidx.fragment:fragment:1.4.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation "com.google.android.material:material:1.3.0"
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.2'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // ===== SSH 服务端（exec / shell）=====
    // Apache MINA SSHD：目前唯一活跃维护的纯 Java SSH 实现，sshd-core 自带服务端。
    // 只开放命令执行与交互 shell，不需要文件传输，所以没引 sshd-sftp / sshd-scp。
    // 版本选 2.9.2：仍然是 Java 8 字节码，和当前 AGP 4.1 的 D8 兼容（更新版本多为 Java 11+）。
    implementation 'org.apache.sshd:sshd-core:2.9.2'
    // sshd 用 slf4j 打日志，simple 实现把日志落到 System.err，logcat 里能看到
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    // implementation 'com.google.android.material:material:1.12.0'
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                // options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}
