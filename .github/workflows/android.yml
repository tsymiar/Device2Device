name: Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # scadup（app/src/main/cpp/scadup）是子模块，native 编译要它的源码
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Android SDK components
      run: |
        SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$SDKMANAGER" ]; then
          SDKMANAGER="${ANDROID_HOME}/tools/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-31" "build-tools;30.0.3" "ndk;23.0.7599858"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/23.0.7599858" >> $GITHUB_ENV

    - name: Write local.properties
      run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

    # 单一真源：C++ Message.h 的 enum MASSAGER -> Receiver.java，防 C/JNI 数值偏离
    - name: Regenerate Receiver.java
      run: python3 tools/gen_receiver_java.py

    # 仓库没有 gradle wrapper，按 AGP 4.1.3 对应的 7.0.2 下发（同 azure-pipelines.yml）
    - name: Set up Gradle 7.0.2
      run: |
        curl -sL https://services.gradle.org/distributions/gradle-7.0.2-bin.zip -o gradle-7.0.2-bin.zip
        unzip -qo gradle-7.0.2-bin.zip
        echo "$(pwd)/gradle-7.0.2/bin" >> $GITHUB_PATH

    - name: gradle assembleDebug
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload debug APKs
      uses: actions/upload-artifact@v4
      with:
        name: debug-apks
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
